<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TripZen — Register</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2d1b4e;
      font-family: 'Segoe UI', sans-serif;
    }

    .auth-card {
      background: #3d2660;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2.5rem 2.25rem;
      width: 380px;
    }

    .brand { text-align: center; margin-bottom: 2rem; }
    .brand h1 { font-size: 1.6rem; font-weight: 600; color: #fff; letter-spacing: 0.5px; }
    .brand p { font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 6px; }

    .flash-error {
      background: rgba(220,53,69,0.15);
      border: 1px solid rgba(220,53,69,0.4);
      color: #ff8a8a;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    .flash-success {
      background: rgba(25,135,84,0.15);
      border: 1px solid rgba(25,135,84,0.4);
      color: #75d8a8;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    label {
      display: block;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 6px;
      margin-top: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    input::placeholder { color: rgba(255,255,255,0.3); }
    input:focus { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.12); }

    .password-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-top: 5px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 1.75rem;
      padding: 11px;
      background: #6c3eb5;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover { background: #7d4ecc; }

    .footer-link { text-align: center; font-size: 13px; color: rgba(255,255,255,0.45); margin-top: 1.25rem; }
    .footer-link a { color: #c9a6ff; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <h1>TripZen ✈️</h1>
      <p>Create your account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="{{ 'flash-success' if category == 'success' else 'flash-error' }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form>
      <label>Username</label>
      <input type="text" name="username" placeholder="Yugan" required />

      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required />

      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required />
      <p class="password-hint">Minimum 6 characters</p>

      <button type="submit" class="submit-btn">Create account</button>
    </form>

    <p class="footer-link">Already have an account? <a href="/login-page">Sign in</a></p>
  </div>

  <script>
    document.querySelector('form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.querySelector('input[name="username"]').value;
        const email    = document.querySelector('input[name="email"]').value;
        const password = document.querySelector('input[name="password"]').value;

        try {
            const response = await fetch('http://localhost:5000/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name: username, email, password })
            });

            const data = await response.json();

            if (response.ok) {
                window.location.href = 'http://localhost:5000/login-page';
            } else {
                const existing = document.querySelector('.flash-error');
                if (existing) existing.remove();

                const err = document.createElement('div');
                err.className   = 'flash-error';
                err.textContent = data.error || 'Registration failed.';
                document.querySelector('.auth-card').insertBefore(
                    err, document.querySelector('form')
                );
            }
        } catch (err) {
            console.error('Register error:', err);
        }
    });
  </script>
</body>
</html>
